Rules:
	World:
		ScriptLobbyDropdown@difficulty:
			ID: difficulty
			Label: dropdown-missionbrowser-difficulty.label
			Description: dropdown-missionbrowser-difficulty.description
			Default: normal
			Values:
				easy: campaign-difficulty-easy
				normal: label-missionbrowser-normal-difficulty
				hard: campaign-difficulty-hard
		RTSAICampaign:
			Mission: ghosts-on-the-glass
		ObjectivesPanel:
			PanelName: MISSION_OBJECTIVES
		MissionData:
			Briefing: briefing
		-SpawnStartingUnits:
		-CrateSpawner:
		-StartGameNotification:
	Player:
		-ConquestVictoryConditions:
	htnk:
		ExternalCondition@phantom:
			Condition: phantom
		ExternalCondition@spoof-off:
			Condition: spoof-off
		ExternalCondition@sensor-on:
			Condition: sensor-on
		ExternalCondition@sensor-tripped:
			Condition: sensor-tripped
		Armament@primary:
			RequiresCondition: !rank-elite && !phantom
		Armament@elite:
			RequiresCondition: rank-elite && !phantom
		DamageMultiplier@unverified:
			Modifier: 10
			RequiresCondition: phantom && !sensor-tripped && !spoof-off
		DamageMultiplier@ghost:
			Modifier: 0
			RequiresCondition: phantom && (sensor-tripped || spoof-off)
		Cloak@ghost:
			InitialDelay: 0
			CloakDelay: 0
			UncloakOn: None
			DetectionTypes: Ghost
			RequiresCondition: phantom && (sensor-tripped || spoof-off)
		WithRangeCircle@contact:
			Range: 3c0
			Visible: Always
			ValidRelationships: Ally, Neutral, Enemy
			Color: FFB53CF0
			Width: 2
			BorderColor: 00000080
			BorderWidth: 4
			RequiresCondition: sensor-on && !sensor-tripped && !spoof-off
		WithRangeCircle@ghost:
			Range: 3c0
			Visible: Always
			ValidRelationships: Ally, Neutral, Enemy
			Color: C8DCE6A0
			Width: 1
			BorderColor: 00000080
			BorderWidth: 3
			RequiresCondition: phantom && (sensor-tripped || spoof-off)
		WithRangeCircle@hostile:
			Range: 3c0
			Visible: Always
			ValidRelationships: Ally, Neutral, Enemy
			Color: FF3A2AF0
			Width: 3
			BorderColor: 00000080
			BorderWidth: 5
			RequiresCondition: !phantom && sensor-on && (sensor-tripped || spoof-off)
