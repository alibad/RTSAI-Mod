naweap:
	GrantConditionOnProduction@hezbollah-drone:
		Actors: r2hzdrone
		Condition: roof-open
		Duration: 50
		ShowSelectionBar: false

# The shipyard's shore relay keeps a fresh Sahaab boat controllable at the pier.
nayard:
	GrantConditionOnFaction@hezbollah-relay:
		Condition: hezbollah-relay
		Factions: hezbollah
	ProximityExternalCondition@hezbollah-relay:
		Condition: r2-hz-link
		Range: 6c0
		ValidRelationships: Ally
		RequiresCondition: hezbollah-relay

dog:
	RenderSprites:
		FactionImages:
			hezbollah: dog

# Drone Spotter guidance: longer reach and faster reloads, never stacking.
^R2HezbollahGuided:
	ExternalCondition@guidance:
		Condition: r2-hz-guidance
	RangeMultiplier@guidance:
		Modifier: 120
		RequiresCondition: r2-hz-guidance
	ReloadDelayMultiplier@guidance:
		Modifier: 80
		RequiresCondition: r2-hz-guidance
	WithTextDecoration@guidance:
		Text: GUIDED
		Position: Top
		Margin: 0, -14
		Color: 70F0E0
		RequiresSelection: true
		RequiresCondition: r2-hz-guidance

r2hztechnical:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: levant-r2hztechnical-name
	Buildable:
		BuildPaletteOrder: 11
		Prerequisites: ~faction.hezbollah, naweap
		Description: levant-r2hztechnical-description
	Valued:
		Cost: 400
	Health:
		HP: 180
	Armor:
		Type: Light
	Mobile:
		Speed: 150
		Locomotor: wheeled
		TurnSpeed: 32
	Turreted:
		TurnSpeed: 40
	Armament:
		Weapon: R2HZTechnicalMG
		MuzzleSequence: muzzle
	RevealsShroud:
		Range: 8c0

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
r2hzrecoilless:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: levant-r2hzrecoilless-name
	Buildable:
		BuildPaletteOrder: 21
		Prerequisites: ~faction.hezbollah, naweap
		Description: levant-r2hzrecoilless-description
	# Salvo and swarm: 550 -> 475 (recoilless 85 -> 78): basic anti-armour, more of them.
	Valued:
		Cost: 475
	Health:
		HP: 170
	Armor:
		Type: Light
	Mobile:
		Speed: 145
		Locomotor: wheeled
		TurnSpeed: 32
	Turreted:
		TurnSpeed: 32
	Armament:
		Weapon: R2HZRecoillessRifle
		MuzzleSequence: muzzle

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
r2hzescort:
	Inherits: ^R2ModernVehicle
	Inherits@AUTOTARGET: ^AutoTargetAir
	Tooltip:
		Name: levant-r2hzescort-name
	Buildable:
		BuildPaletteOrder: 41
		Prerequisites: ~faction.hezbollah, naweap
		Description: levant-r2hzescort-description
	Valued:
		Cost: 600
	Health:
		HP: 190
	Armor:
		Type: Light
	Mobile:
		Speed: 140
		Locomotor: wheeled
		TurnSpeed: 32
	Turreted:
		TurnSpeed: 48
	Armament:
		Weapon: R2HZZU23
	AutoTarget:
		ScanRadius: 9

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
r2hzrockets:
	Inherits: ^R2ModernVehicle
	Inherits@guidance: ^R2HezbollahGuided
	Tooltip:
		Name: levant-r2hzrockets-name
	Buildable:
		BuildPaletteOrder: 61
		Prerequisites: ~faction.hezbollah, naweap, radar
		Description: levant-r2hzrockets-description
	# Salvo and swarm: 900 -> 800; one strike missile -> a volley of 8 unguided rockets (the art is a tube
	# launcher). The empty launcher is the visible reload window; flank it then.
	Valued:
		Cost: 800
	Health:
		HP: 180
	Armor:
		Type: Light
	Mobile:
		Speed: 90
		Locomotor: wheeled
	-Turreted:
	-AttackTurreted:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 32
	Armament:
		Weapon: R2HZRocketVolley
		ReloadingCondition: reloading
	WithRangeCircle:
		Range: 12c0

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
	GrantConditionOnMovement@setup:
		Condition: moving
	ReloadDelayMultiplier@setup:
		Modifier: 70
		RequiresCondition: !moving
	WithTextDecoration@setup:
		Text: SET
		Color: B3B881
		RequiresCondition: !moving
		RequiresSelection: true

# Rail Technical (Salvo and swarm): the cheap launcher. A pickup with a fixed rail pack of four unguided rockets,
# fired forward; no radar needed. Guided by spotters and signal posts like the rocket battery.
r2hzrail:
	Inherits: ^R2ModernVehicle
	Inherits@guidance: ^R2HezbollahGuided
	Tooltip:
		Name: levant-r2hzrail-name
	Buildable:
		BuildPaletteOrder: 55
		Prerequisites: ~faction.hezbollah, naweap
		Description: levant-r2hzrail-description
	Valued:
		Cost: 450
	Health:
		HP: 140
	Armor:
		Type: Light
	Mobile:
		Speed: 140
		Locomotor: wheeled
		TurnSpeed: 32
	-Turreted:
	-AttackTurreted:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 48
	Armament:
		Weapon: R2HZRailRockets
	WithRangeCircle:
		Range: 10c0

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
