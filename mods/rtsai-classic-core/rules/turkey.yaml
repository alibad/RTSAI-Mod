# Turkey: mobile combined arms, drones, electronic warfare, layered air
# defense, amphibious mobility, and sea control. All names and platforms are
# fictionalized for this RTS setting. Research and design provenance lives in
# docs/turkey-faction-research.md.

^BaseWorld:
	Locomotor@AMPHIBIOUS:
		Name: amphibious
		Crushes: mine, crate
		TerrainSpeeds:
			Clear: 90
			Rough: 55
			Road: 105
			Bridge: 100
			Ore: 75
			Gems: 75
			Beach: 90
			Water: 80

^ExistsInWorld:
	ExternalCondition@TURKEYDESIGNATED:
		Condition: turkey-designated
	DamageMultiplier@TURKEYDESIGNATED:
		Modifier: 125
		RequiresCondition: turkey-designated
	WithDecoration@TURKEYDESIGNATED:
		Image: turkey_designator
		Sequence: marker
		Palette: effect
		Position: TopRight
		Margin: 4, 4
		ValidRelationships: Ally, Enemy, Neutral
		RequiresCondition: turkey-designated

World:
	StartingUnits@mcvonlyturkey:
		Class: none
		ClassName: options-starting-units.mcv-only
		Factions: turkey
		BaseActor: mcv
	StartingUnits@lightturkey:
		Class: light
		ClassName: options-starting-units.light-support
		Factions: turkey
		BaseActor: mcv
		SupportActors: trrifle,trrifle,trrifle,trat,trdroneop,aras8,gokkalkan
		InnerSupportRadius: 3
		OuterSupportRadius: 5
	StartingUnits@heavyturkey:
		Class: heavy
		ClassName: options-starting-units.heavy-support
		Factions: turkey
		BaseActor: mcv
		SupportActors: trrifle,trrifle,trrifle,trat,trdroneop,aras8,bozkir,bozkir,denizkaplan
		InnerSupportRadius: 3
		OuterSupportRadius: 5

