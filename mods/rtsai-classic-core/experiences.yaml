					Navy: ILPATROL, ILFRIGATE, ILTENDER
					Buildings: FACT, WEAP, TENT, HPAD, ILAIRFIELD, SYRD, ILRELAY, ILWORKSHOP
					Defenses: ILSENTRY, ILBATTERY, ILATPOST
