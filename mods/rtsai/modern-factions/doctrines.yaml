# Faction bot doctrines (OpenRA.Mods.RTSAI BotDoctrine). Each bot profile (normal, medium, rush,
# turtle, naval) keeps its own RoleShares (combined-arms-ai.yaml); the doctrine scales them in
# percent for its faction and replaces the generic opening (entries follow the tech tree: an entry
# whose prerequisites are missing is skipped until it becomes buildable; a building listed twice is
# wanted twice). Every opening takes a second refinery right after the factory: the support
# buildings before it had cost the modern bots about 40% of America's income by 10 minutes.
# Roles come from StrategicRole tags.
# Doctrine identifiers match the product catalog (Experience "Doctrine" field).
#
# Tuned with tools/balance-harness.py (docs/balance.md). The modern factions' dedicated AA vehicles
# and sites are air-only (^AAMissile), unlike the stock IFV/flak units that share the anti-air role,
# so every doctrine keeps anti-air low: in bot-vs-bot rounds they destroyed 0.02-0.15 credits per
# credit spent. Other cuts follow the same measure (value destroyed per credit produced).
# AirDefenseShare: anti-air stays low until visible enemy aircraft (including airborne rocketeers)
# outvalue the bot's own anti-air units; then the role's share rises to 24 until they are matched.
# SquadSizeModifier scales the profile's attack-squad size (a unit count): factions with cheap units
# gather more of them, factions with expensive units fewer, so squads carry similar value.
# Round 3: riflemen were the most cost-effective unit of China, Turkiye, Iran, Yemen and Hezbollah (1.6-1.9
# destroyed per credit against 0.6-0.8 for most tanks), so
# China (140), Turkiye (130) and Iran (120) field more line infantry; China's Mantis (0.27 per credit) and
# Turkiye's Sancak (0.23) were cut back, and Iran's Toophan share returns to 100.
# Round 4: China support 150 -> 100 (Lynx 0.24 per credit); Turkiye main-battle-tank 130 -> 110 (Bozkir 30%
# of production at 0.83 per credit).

Player:
	# Coordination: specialists and relays with the main force, amphibious lift, maritime reach.
	BotDoctrine@china:
		Factions: china
		Doctrine: networked-combined-arms
		AirDefenseShare: 24
		# Round 5: no Air Force Command in the opening (1000 credits idle until aircraft); artillery 60 -> 100 (the PHL).
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, garefn
		RoleShareModifiers:
			line-infantry: 140
			transport: 150
			main-battle-tank: 110
			artillery: 100
			anti-air: 25
			naval-screen: 120
			anti-submarine: 120
			submarine: 120
	# Layered denial: radar and an AA site right after the factory, then long-range fires and drones.
	BotDoctrine@iran:
		Factions: iran
		Doctrine: layered-denial
		AirDefenseShare: 24
		InitialBuildOrder: napowr, narefn, nahand, naweap, narefn, naradr, r2iraasite
		SquadSizeModifier: 105
		RoleShareModifiers:
			line-infantry: 120
			anti-air: 40
			artillery: 150
			strike-aircraft: 80
			submarine: 130
	# Mobile defense: mechanized spearhead with an early service depot, carried infantry, drones and EW.
	BotDoctrine@turkey:
		Factions: turkey
		Doctrine: mobile-defense
		AirDefenseShare: 24
		# Round 5: no Air Force Command in the opening; support, transport and strike aircraft halved (Sancak 0.24,
		# Aras 0.36, Kuzgun 0.54 destroyed per credit), so the shares go to Bozkirs, riflemen and AT teams.
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, garefn, gadept
		RoleShareModifiers:
			transport: 50
			support: 50
			line-infantry: 130
			main-battle-tank: 110
			strike-aircraft: 50
			anti-air: 20
			artillery: 80
	# Expeditionary: air power (Air Force Command, JTAC radar) right after the first armor; heavy
	# armor and guided fires lead, infantry holds ground.
	BotDoctrine@saudi:
		Factions: saudi
		Doctrine: expeditionary
		AirDefenseShare: 24
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, garefn, gaairc
		SquadSizeModifier: 70
		RoleShareModifiers:
			main-battle-tank: 150
			strike-aircraft: 150
			interceptor: 150
			artillery: 80
			anti-air: 50
			transport: 120
			naval-screen: 110
			line-infantry: 80
			anti-armor: 90
	# Asymmetric defense: cheap ambush infantry and technicals, guided rockets, one-way drones,
	# linked boats. Barracks before the refinery and a concealed bunker early; little heavy equipment.
	BotDoctrine@yemen:
		Factions: yemen
		Doctrine: asymmetric-defense
		AirDefenseShare: 24
		InitialBuildOrder: napowr, nahand, narefn, r2ybunker, naweap, narefn, naradr
		SquadSizeModifier: 135
		RoleShareModifiers:
			line-infantry: 130
			anti-armor: 160
			artillery: 140
			strike-aircraft: 50
			naval-screen: 140
			anti-air: 40
			transport: 50

	BotDoctrine@israel:
		Factions: israel
		Doctrine: precision-support
		AirDefenseShare: 24
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, garefn, gaairc, r2ilrelay
		SquadSizeModifier: 75
		RoleShareModifiers:
			main-battle-tank: 135
			support: 140
			transport: 120
			anti-air: 40
	# Salvo and swarm (docs/hezbollah-doctrine.md): few veteran fighters, rocket volume, FPV drone teams
	# (the drone-swarm role, share in hezbollah-ai.yaml). Pricier units: squads back to the profile's size. The
	# concealed bunker leaves the opening and is built with the other defenses.
	BotDoctrine@hezbollah:
		Factions: hezbollah
		Doctrine: salvo-and-swarm
		# Round 5 trim 4: America's rocketeers and jets made a fifth of Hezbollah's losses; its escort gun trucks
		# traded 1.4 per credit there, so the anti-air response is larger (24 -> 40).
		AirDefenseShare: 40
		InitialBuildOrder: napowr, nahand, narefn, naweap, narefn, naradr, r2hzrelay
		SquadSizeModifier: 100
		RoleShareModifiers:
			line-infantry: 100
			anti-armor: 120
			artillery: 175
			support: 100
			anti-air: 40
			strike-aircraft: 50
