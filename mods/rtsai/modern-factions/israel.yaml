		UnitLimits:
			r2namer: 3

gaairc:
	ProvidesPrerequisite@harrier-israel:
		Prerequisite: aircraft.harrier
		Factions: israel

gaweap:
	GrantConditionOnProduction@israel-helicopter:
		Actors: r2ilgunship
		Condition: roof-open
		Duration: 50
		ShowSelectionBar: false

r2merkava:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: levant-r2merkava-name
	Buildable:
		BuildPaletteOrder: 21
		Prerequisites: ~faction.israel, gaweap
		Description: levant-r2merkava-description
	# Same gun as the 1100-credit M1A2S with 23% more HP: 1450 traded 0.63 per credit.
	Valued:
		Cost: 1250
	Health:
		HP: 640
	Armor:
		Type: Heavy
	Mobile:
		Speed: 80
	Turreted:
		TurnSpeed: 24
	Armament:
		Weapon: R2ILAbramsGun
		MuzzleSequence: muzzle

	Inherits@coordination: ^LevantIsraelCoordination
	ExternalCondition@repair:
		Condition: israel-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: israel-repair
r2ilshield:
	Inherits: ^R2ModernVehicle
	Inherits@AUTOTARGET: ^AutoTargetAir
	Tooltip:
		Name: levant-r2ilshield-name
	Buildable:
		BuildPaletteOrder: 41
		Prerequisites: ~faction.israel, gaweap, radar
		Description: levant-r2ilshield-description
	Valued:
		Cost: 1050
	Health:
		HP: 240
	Armor:
		Type: Light
	Mobile:
		Speed: 105
	Armament:
		Weapon: R2ILSADSInterceptor
	AutoTarget:
		ScanRadius: 12
	RevealsShroud:
		Range: 11c0
	# Air-only missiles traded 0-6 with rocketeers at equal value (tools/balance-duel.py); the reload
	# drops from 120 to 42 ticks so the dedicated AA beats them, as the flak track does.
	ReloadDelayMultiplier@AIRDEFENSE:
		Modifier: 35

	Inherits@coordination: ^LevantIsraelCoordination
	ExternalCondition@repair:
		Condition: israel-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: israel-repair
r2ilhowitzer:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: levant-r2ilhowitzer-name
	Buildable:
		BuildPaletteOrder: 61
		Prerequisites: ~faction.israel, gaweap, radar
		Description: levant-r2ilhowitzer-description
	Valued:
		Cost: 1250
	Health:
		HP: 200
	Armor:
		Type: Light
	Mobile:
		Speed: 115
		Locomotor: wheeled
	-Turreted:
	-AttackTurreted:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 32
	Armament:
		Weapon: R2ILCaesarShell
		MuzzleSequence: muzzle
	WithRangeCircle:
		Range: 13c0

	Inherits@coordination: ^LevantIsraelCoordination
	ExternalCondition@repair:
		Condition: israel-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: israel-repair
r2namer:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: levant-r2namer-name
	Buildable:
		BuildPaletteOrder: 31
		Prerequisites: ~faction.israel, gaweap
		Description: levant-r2namer-description
	Valued:
		Cost: 1050
	Health:
		HP: 420
	Armor:
		Type: Heavy
	Mobile:
		Speed: 85
		PauseOnCondition: loading || chronodisable
	Cargo:
		Types: Infantry
		MaxWeight: 5
		UnloadVoice: Move
		LoadingCondition: loading
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		Palette: pips
	Armament:
		Weapon: R2ILBradleyCannon
		MuzzleSequence: muzzle
	Armament@tow:
		Name: secondary
		Weapon: R2ILBradleyTOW
	AttackTurreted:
		Armaments: primary, secondary

	Inherits@coordination: ^LevantIsraelCoordination
	ExternalCondition@repair:
		Condition: israel-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: israel-repair
