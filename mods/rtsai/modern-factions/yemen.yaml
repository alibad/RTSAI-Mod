naweap:
	GrantConditionOnProduction@yemen-drone:
		Actors: r2samad
		Condition: roof-open
		Duration: 50
		ShowSelectionBar: false

# The shipyard's shore relay keeps a fresh Sahaab boat controllable at the pier.
nayard:
	GrantConditionOnFaction@yemen-relay:
		Condition: yemen-relay
		Factions: yemen
	ProximityExternalCondition@yemen-relay:
		Condition: r2-ye-link
		Range: 6c0
		ValidRelationships: Ally
		RequiresCondition: yemen-relay

dog:
	RenderSprites:
		FactionImages:
			yemen: dog

# Drone Spotter guidance: longer reach and faster reloads, never stacking.
^R2YemenGuided:
	ExternalCondition@guidance:
		Condition: r2-ye-guidance
	RangeMultiplier@guidance:
		Modifier: 120
		RequiresCondition: r2-ye-guidance
	ReloadDelayMultiplier@guidance:
		Modifier: 80
		RequiresCondition: r2-ye-guidance
	WithTextDecoration@guidance:
		Text: GUIDED
		Position: Top
		Margin: 0, -14
		Color: 70F0E0
		RequiresSelection: true
		RequiresCondition: r2-ye-guidance

r2technical:
