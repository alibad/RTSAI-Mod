# Round 3: the Qilin and Bozkir reach 5c768 like the 120mm of the Rhino and Karrar (105mm base: 5c0);
# outranged by every ATGM team, they traded 0.65-0.76 per credit (docs/balance.md).
R2QilinGun:
	Inherits: 105mm
	Range: 5c768
	ReloadDelay: 65
	Warhead@1Dam: SpreadDamage
		Damage: 68

# Round 5: the coaxial machine gun of the Allied-side MBTs (Qilin, Bozkir, M1A2S, Merkava). Their tanks failed
# to kill the infantry-led armies that beat them (the main guns do 25% to infantry); the coax gives each tank
# about one rifleman's fire.
