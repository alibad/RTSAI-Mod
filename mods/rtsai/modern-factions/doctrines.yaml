# Faction bot doctrines (OpenRA.Mods.RTSAI BotDoctrine). Each bot profile (normal, medium, rush,
# turtle, naval) keeps its own RoleShares (combined-arms-ai.yaml); the doctrine scales them in
# percent for its faction and replaces the generic opening (entries follow the tech tree: an entry
# whose prerequisites are missing is skipped until it becomes buildable). Roles come from StrategicRole tags.
# Doctrine identifiers match the product catalog (Experience "Doctrine" field).
#
# Tuned with tools/balance-harness.py (docs/balance.md). The modern factions' dedicated AA vehicles
# and sites are air-only (^AAMissile), unlike the stock IFV/flak units that share the anti-air role,
# so every doctrine keeps anti-air low: in bot-vs-bot rounds they destroyed 0.02-0.15 credits per
# credit spent. Other cuts follow the same measure (value destroyed per credit produced).
# SquadSizeModifier scales the profile's attack-squad size (a unit count): factions with cheap units
# gather more of them, factions with expensive units fewer, so squads carry similar value.

Player:
	# Coordination: specialists and relays with the main force, amphibious lift, maritime reach.
	BotDoctrine@china:
		Factions: china
		Doctrine: networked-combined-arms
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, gaairc
		RoleShareModifiers:
			support: 150
			transport: 150
			main-battle-tank: 110
			artillery: 60
			anti-air: 40
			naval-screen: 120
			anti-submarine: 120
			submarine: 120
	# Layered denial: radar and an AA site right after the factory, then long-range fires and drones.
	BotDoctrine@iran:
		Factions: iran
		Doctrine: layered-denial
		InitialBuildOrder: napowr, narefn, nahand, naweap, naradr, r2iraasite
		SquadSizeModifier: 105
		RoleShareModifiers:
			anti-air: 40
			artillery: 150
			anti-armor: 110
			strike-aircraft: 80
			submarine: 130
	# Mobile defense: mechanized spearhead with an early service depot, carried infantry, drones and EW.
	BotDoctrine@turkey:
		Factions: turkey
		Doctrine: mobile-defense
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, gadept, gaairc
		RoleShareModifiers:
			main-battle-tank: 130
			support: 130
			strike-aircraft: 80
			anti-air: 40
			artillery: 80
	# Expeditionary: air power (Air Force Command, JTAC radar) right after the first armor; heavy
	# armor and guided fires lead, infantry holds ground.
	BotDoctrine@saudi:
		Factions: saudi
		Doctrine: expeditionary
		InitialBuildOrder: gapowr, garefn, gapile, gaweap, gaairc
		SquadSizeModifier: 70
		RoleShareModifiers:
			main-battle-tank: 150
			strike-aircraft: 150
			interceptor: 150
			artillery: 80
			anti-air: 50
			transport: 120
			naval-screen: 110
			line-infantry: 80
			anti-armor: 90
	# Asymmetric defense: cheap ambush infantry and technicals, guided rockets, one-way drones,
	# linked boats. Barracks before the refinery and a concealed bunker early; little heavy equipment.
	BotDoctrine@yemen:
		Factions: yemen
		Doctrine: asymmetric-defense
		InitialBuildOrder: napowr, nahand, narefn, r2ybunker, naweap, naradr
		SquadSizeModifier: 135
		RoleShareModifiers:
			line-infantry: 130
			anti-armor: 110
			artillery: 140
			strike-aircraft: 50
			naval-screen: 140
			anti-air: 40
			transport: 50
