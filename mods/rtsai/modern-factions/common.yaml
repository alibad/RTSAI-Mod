# Native RA2 rendering; no classic-perspective sprites or proprietary art.
World:
	SpawnStartingUnits:
		StartingUnitsClass: medium

Player:
	ProvidesPrerequisite@china:
		Prerequisite: faction.china
		Factions: china
	ProvidesPrerequisite@iran:
		Prerequisite: faction.iran
		Factions: iran
	ProvidesPrerequisite@turkey:
		Prerequisite: faction.turkey
		Factions: turkey
	ProvidesPrerequisite@saudi:
		Prerequisite: faction.saudi
		Factions: saudi
	ProvidesPrerequisite@yemen:
		Prerequisite: faction.yemen
		Factions: yemen

^R2ModernVehicle:
	Inherits: ^Vehicle
	Tooltip:
		GenericName: ra2-modern-vehicle
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@MC: ^MindControllable
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		Queue: Vehicle
	RenderSprites:
	Turreted:
		TurnSpeed: 28
	AttackTurreted:
		Voice: Attack
	WithMuzzleOverlay:
	RevealsShroud:
		Range: 8c0
	Mobile:
		Locomotor: heavytracked
		TurnSpeed: 24
	AutoTarget:
	Selectable:
		Bounds: 1544, 2300, 0, -289
	HitShape:
	ProducibleWithLevel:
		Prerequisites: warfactory.infiltrated
	# Stock RA2 units swap to a stronger elite weapon (+25-67% damage); modern units have none, so
	# elite rank adds this on top of the shared veterancy bonuses instead.
	FirepowerMultiplier@ELITEARMS:
		RequiresCondition: rank-elite
		Modifier: 140

^R2ModernDrone:
	Inherits: ^Aircraft
	Tooltip:
		GenericName: ra2-modern-aircraft
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 95
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	RenderSprites:
	RevealsShroud:
		Range: 11c0
		Type: CenterPosition
	AttackAircraft:
		Voice: Attack
		AttackType: Hover
	Aircraft:
		CruiseAltitude: 3072
		LandableTerrainTypes: Clear, Rough, Road, DirtRoad, Ore, Gems
		TurnSpeed: 32
		Speed: 180
		AltitudeVelocity: 120
		CruisingCondition: cruising
		IdleBehavior: Land
	Hovers@CRUISING:
		RequiresCondition: cruising
		BobDistance: -30
	Repairable:
		Voice: Move
		RepairActors: gadept, nadept, caoutp
	Voiced:
		VoiceSet: NighthawkVoice
	Armor:
		Type: Light
	Selectable:
		Bounds: 1544, 2509, 0, -289
	HitShape:

^R2Networked:
	ExternalCondition@network:
		Condition: r2-network
	ReloadDelayMultiplier@network:
		Modifier: 85
		RequiresCondition: r2-network

^R2Protected:
	ExternalCondition@screen:
		Condition: r2-screen
	DamageMultiplier@screen:
		Modifier: 85
		RequiresCondition: r2-screen

^R2DroneHusk:
	Inherits: ^HelicopterHusk
	Tooltip:
		Name: ra2-modern-husk
		GenericName: ra2-modern-husk
	FallsToEarth:
		Explosion: PlaneExplode
		MaximumSpinSpeed: 10
