# Shared presentation only: retain Maverick's projectile and damage mechanics.
^R2InfantryRocket:
	Inherits: Maverick
	Warhead@2Eff: CreateEffect
		Image: rtsai-atgm-impact
		Explosions: impact

# Round 3: the Qilin and Bozkir reach 5c768 like the 120mm of the Rhino and Karrar (105mm base: 5c0);
# outranged by every ATGM team, they traded 0.65-0.76 per credit (docs/balance.md).
R2QilinGun:
	Inherits: 105mm
	Range: 5c768
	ReloadDelay: 65
	Warhead@1Dam: SpreadDamage
		Damage: 68
	# RA2's blast for a 68-damage shell (its AnimList rule; weapon fidelity, 20 Nov 2026)
	Warhead@2Eff:
		Explosions: small_clsn

# Round 5: the coaxial machine gun of the Allied-side MBTs (Qilin, Bozkir, M1A2S, Merkava). Their tanks failed
# to kill the infantry-led armies that beat them (the main guns do 25% to infantry); the coax gives each tank
# about one rifleman's fire. Round 6: damage 16 -> 12. At 16 the Allied side scored 66% against the Soviet side on
# main and 65% on Harbor Line (round-5 finals); at 12 it was 52-54% on main in the round-6 probes. Iran's Karrar
# has it too since round 6.
R2QilinCoax:
	Inherits: M60
	Range: 5c0
	ReloadDelay: 20
	Warhead@1Dam: SpreadDamage
		Damage: 12

R2KarrarGun:
	Inherits: 120mm
	ReloadDelay: 75
	Warhead@1Dam: SpreadDamage
		Damage: 90
	# RA2's blast for a 90-damage shell (its AnimList rule; weapon fidelity, 20 Nov 2026)
	Warhead@2Eff:
		Explosions: small_clsn

# Reload 70 -> 60: Rhino damage per credit at the Rhino's cost.
R2BozkirGun:
	Inherits: 105mm
	Range: 5c768
	ReloadDelay: 60
	Warhead@1Dam: SpreadDamage
		Damage: 80
	# RA2's blast for a 80-damage shell (its AnimList rule; weapon fidelity, 20 Nov 2026)
	Warhead@2Eff:
		Explosions: small_clsn

R2ReconGun:
	Inherits: 20mm
	ValidTargets: Ground, Water
	ReloadDelay: 25
	Warhead@1Dam: SpreadDamage
		Damage: 12
		ValidTargets: Ground, Water

R2AirDefense:
	Inherits: MammothTusk
	Range: 10c0
	ReloadDelay: 90
	Projectile: Missile
		Speed: 300
		RangeLimit: 16c0
		MinimumLaunchAngle: 64
		MaximumLaunchAngle: 128
		CruiseAltitude: 3c0
	Warhead@1Dam: SpreadDamage
		Damage: 45

R2Howitzer:
	Inherits: 155mm
	Range: 12c0
	MinRange: 4c0
	ReloadDelay: 140
	Projectile: Bullet
		LaunchAngle: 62
		Speed: 240
	Warhead@1Dam: SpreadDamage
		Damage: 95
		Spread: 341
	# RA2's blast for a 95-damage shell (its AnimList rule; weapon fidelity, 20 Nov 2026)
	Warhead@2Eff:
		Explosions: medium_grey_explosion

R2RocketSalvo:
	Inherits: Maverick
	Range: 11c0
	MinRange: 4c0
	ReloadDelay: 180
	Burst: 4
	BurstDelays: 8
	Projectile: Missile
		Speed: 240
		RangeLimit: 18c0
		MinimumLaunchAngle: 32
		MaximumLaunchAngle: 64
		CruiseAltitude: 1c512
	Warhead@1Dam: SpreadDamage
		Damage: 30
		Spread: 256
	# RA2's blast for a 30-damage hit (its AnimList rule; weapon fidelity, 20 Nov 2026)
	Warhead@2Eff:
		Explosions: small_grey_explosion

# Damage 35 -> 60: the 1000-credit Cloud, Kuzgun and Mohajer traded 0.3-0.4 per credit.
R2DroneMissile:
	Inherits: Maverick
	Range: 6c0
	ReloadDelay: 140
	Warhead@1Dam: SpreadDamage
		Damage: 60
	# RA2's blast for a 60-damage hit (its AnimList rule; weapon fidelity, 20 Nov 2026)
	Warhead@2Eff:
		Explosions: small_explosion
	# Reaches the end of its range after its climb (weapon fidelity, 20 Nov 2026)
	Projectile:
		RangeLimit: 11c256

