# Fixed-wing aircraft use a native Plane production/resupply building instead
# of borrowing the helicopter pad.  Reuse the stock Airfield presentation and
# behavior while gating this copy to the Saudi structure tree.
SAFLD:
	Inherits: AFLD
	Buildable:
		Queue: Building
		BuildPaletteOrder: 130
		Prerequisites: dome, ~structures.saudi, ~techlevel.medium
		Description: actor-afld.description
	ProvidesPrerequisite@saudi:
		Factions: saudi
		Prerequisite: aircraft.saudi
	-ProvidesPrerequisite@soviet:
	-ProvidesPrerequisite@sovietvanilla:
	-ProvidesPrerequisite@russia:
	-ProvidesPrerequisite@ukraine:
	-ProvidesPrerequisite@sovietstructure:
	-ProvidesPrerequisite@sovietvanillastructure:
	-ProvidesPrerequisite@russianstructure:
	-ProvidesPrerequisite@ukrainianstructure:
	-AirstrikePower@spyplane:
	-ParatroopersPower@paratroopers:
	-AirstrikePower@parabombs:
	RenderSprites:
		Image: afld

