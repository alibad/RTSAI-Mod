# Iran is a complete Soviet-lineage faction with a distinct asymmetric roster.
# Stock economy, construction, repair, defenses, transport, veterancy and core
# production remain available; the actors below add the faction identity.

^ExistsInWorld:
	ExternalCondition@IRANSIGNALJAMMED:
		Condition: iran-signal-jammed
	ReloadDelayMultiplier@IRANSIGNALJAMMED:
		Modifier: 165
		RequiresCondition: iran-signal-jammed
	WithDecoration@IRANSIGNALJAMMED:
		Image: ir_signal
		Sequence: marker
		Palette: effect
		Position: TopRight
		Margin: 4, 4
		ValidRelationships: Ally, Enemy, Neutral
		RequiresCondition: iran-signal-jammed

^Infantry:
	ExternalCondition@IRANSUPPRESSED:
		Condition: iran-suppressed
	SpeedMultiplier@IRANSUPPRESSED:
		Modifier: 82
		RequiresCondition: iran-suppressed
	ReloadDelayMultiplier@IRANSUPPRESSED:
		Modifier: 125
		RequiresCondition: iran-suppressed
	WithColoredOverlay@IRANSUPPRESSED:
		Color: D8893040
		RequiresCondition: iran-suppressed

^Vehicle:
	ExternalCondition@IRANATGMTRACKED:
		Condition: iran-atgm-tracked
	SpeedMultiplier@IRANATGMTRACKED:
		Modifier: 65
		RequiresCondition: iran-atgm-tracked
	WithColoredOverlay@IRANATGMTRACKED:
		Color: D8C48938
		RequiresCondition: iran-atgm-tracked

^Building:
	ExternalCondition@IRANSABOTAGED:
		Condition: iran-sabotaged
	ReloadDelayMultiplier@IRANSABOTAGED:
		Modifier: 300
		RequiresCondition: iran-sabotaged
	WithColoredOverlay@IRANSABOTAGED:
		Color: 5DC7DF38
		RequiresCondition: iran-sabotaged

