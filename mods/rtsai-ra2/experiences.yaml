		ra2-combined-arms-ai:
			Title: Combined-arms AI
			Preview: ra2|experience/combined-ai.png
			Description: Role-aware production and configurable formation sizes.
			Effects: Enables our existing combined-arms role shares and formation controls.
			Tradeoffs: Different army composition from actor-share-only recruitment.
			Scope: Native bots; human unit statistics remain unchanged.
			Category: AI & Strategy
			Version: 1
			Rules: ra2|modern-factions/combined-arms-ai.yaml, ra2|experience/formations.yaml
			Parameters:
				formation-size:
					Title: Preferred formation size
					Description: Units bots assemble before attacking, before faction doctrine modifiers.
					Group: AI
					Type: Integer
					Default: 8
					Minimum: 3
					Maximum: 20
					Step: 1
					Unit: units
	Profiles:
		ra2-modern:
			Title: RA2 — World War III
