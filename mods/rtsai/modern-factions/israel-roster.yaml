# Israel Arabia: expeditionary combined arms. JTAC laser marks only amplify
# Israel guided weapons (ATGM, TOW, howitzer, Hellfire, F-15 strike and the
# Falcon One precision bomb); they are not a global damage buff.
^ExistsInWorld:
	ExternalCondition@R2ILMARKED:
		Condition: r2-il-marked
	Targetable@R2ILMARKED:
		TargetTypes: R2ILMarked
		RequiresCondition: r2-il-marked
	WithColoredOverlay@R2ILMARKED:
		Color: FF303022
		RequiresCondition: r2-il-marked

^R2IsraelInfantry:
	Inherits: ^Infantry
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@MC: ^MindControllable
	Buildable:
		Queue: Infantry
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Selectable:
		Bounds: 600, 1500, 0, -530
	FirepowerMultiplier@ELITEARMS:
		RequiresCondition: rank-elite
		Modifier: 140
	-WithDeathAnimation@effect:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 32
	Armament:
		Weapon: R2ILGuardRifle
	ProducibleWithLevel:
		Prerequisites: barracks.infiltrated
	RevealsShroud:
		Range: 5c0

