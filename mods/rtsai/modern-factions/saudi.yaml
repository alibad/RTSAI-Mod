gaairc:
	ProvidesPrerequisite@harrier-saudi:
		Prerequisite: aircraft.harrier
		Factions: saudi

gaweap:
	GrantConditionOnProduction@saudi-helicopter:
		Actors: r2ah64sa
		Condition: roof-open
		Duration: 50
		ShowSelectionBar: false

r2m1a2s:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: ra2-r2m1a2s-name
	Buildable:
		BuildPaletteOrder: 21
		Prerequisites: ~faction.saudi, gaweap
		Description: ra2-r2m1a2s-description
	# Round 5: 1100 -> 1150 with the coaxial machine gun (R2QilinCoax), 0.87 -> 1.27 destroyed per credit.
	Valued:
		Cost: 1150
	Health:
		HP: 520
	Armor:
		Type: Heavy
	Mobile:
		Speed: 80
	Turreted:
		TurnSpeed: 24
	Armament:
		Weapon: R2AbramsGun
		MuzzleSequence: muzzle
	Armament@coax:
		Name: secondary
		Weapon: R2QilinCoax
		LocalOffset: 600,60,700

r2sads:
	Inherits: ^R2ModernVehicle
	Inherits@AUTOTARGET: ^AutoTargetAir
	Tooltip:
		Name: ra2-r2sads-name
	Buildable:
		BuildPaletteOrder: 41
		Prerequisites: ~faction.saudi, gaweap, radar
		Description: ra2-r2sads-description
	Valued:
		Cost: 1050
	Health:
		HP: 240
	Armor:
		Type: Light
	Mobile:
		Speed: 105
	Armament:
		Weapon: R2SADSInterceptor
	AutoTarget:
		ScanRadius: 12
	RevealsShroud:
		Range: 11c0
	# Air-only missiles traded 0-6 with rocketeers at equal value (tools/balance-duel.py); the reload
	# drops from 120 to 42 ticks so the dedicated AA beats them, as the flak track does.
	ReloadDelayMultiplier@AIRDEFENSE:
		Modifier: 35

r2caesar:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: ra2-r2caesar-name
	Buildable:
		BuildPaletteOrder: 61
		Prerequisites: ~faction.saudi, gaweap, radar
		Description: ra2-r2caesar-description
	Valued:
		Cost: 1250
	Health:
		HP: 200
	Armor:
		Type: Light
	Mobile:
		Speed: 115
		Locomotor: wheeled
	-Turreted:
	-AttackTurreted:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 32
	Armament:
		Weapon: R2CaesarShell
		MuzzleSequence: muzzle
	WithRangeCircle:
		Range: 13c0

r2bradley:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: ra2-r2bradley-name
	Buildable:
		BuildPaletteOrder: 31
		Prerequisites: ~faction.saudi, gaweap
		Description: ra2-r2bradley-description
	Valued:
		Cost: 850
	Health:
		HP: 300
	Armor:
		Type: Light
	Mobile:
		Speed: 110
		PauseOnCondition: loading || chronodisable
	Cargo:
		Types: Infantry
		MaxWeight: 5
		UnloadVoice: Move
		LoadingCondition: loading
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		Palette: pips
	Armament:
		Weapon: R2BradleyCannon
		MuzzleSequence: muzzle
	Armament@tow:
		Name: secondary
		Weapon: R2BradleyTOW
	AttackTurreted:
		Armaments: primary, secondary
