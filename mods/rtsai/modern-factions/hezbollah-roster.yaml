		Range: 6c0
	DetectCloakedMultiplier@radar:
		Modifier: 175
		RequiresCondition: active-radar
	RenderDetectionCircle:
	RevealsShroudMultiplier@radar:
		Modifier: 165
		RequiresCondition: active-radar
	# Passive links reach 6 cells; deployed active radar extends them to 14
	# but reveals the craft in explored enemy fog.
	ProximityExternalCondition@link:
		Condition: r2-hz-link
		Range: 6c0
