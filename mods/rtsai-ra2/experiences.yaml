	Components:
		ra2-china:
			Title: China
			Description: Our established China modern faction roster, art, voices and doctrine.
			Effects: Enables this country in faction selection and compatible random pools.
			Tradeoffs: Retains existing army balance and production dependencies.
			Scope: Lobby selection; actor definitions remain available for authored campaigns and saves.
			Category: Faction packs
			Version: 1
			Source: Preserved RTS AI modern-faction work
			License: Original project assets with existing provenance manifests
			Kind: Faction
			Rules: ra2|experience/china.yaml
			Faction:
				InternalName: china
				Side: Allies
				RandomPool: random-allies
				Doctrine: established-china
