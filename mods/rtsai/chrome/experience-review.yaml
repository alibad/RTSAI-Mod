RTSAIPanel@EXPERIENCE_REVIEW_PANEL:
	Logic: ExperienceReviewLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 980
	Height: 690
	Children:
		Label@TITLE:
			Y: 16
			Width: PARENT_WIDTH
			Height: 28
			Text: label-experience-review-title
			Align: Center
			Font: Bold
		Label@SUBTITLE:
			X: 25
			Y: 44
			Width: PARENT_WIDTH - 50
			Height: 18
			Text: label-experience-review-subtitle
			Align: Center
			Font: Tiny
		RTSAIPanel@SUMMARY_PANEL:
			X: 25
			Y: 72
			Width: PARENT_WIDTH - 50
			Height: 76
			Background: dialog3
			Children:
				Label@SUMMARY:
					X: 10
					Y: 7
					Width: PARENT_WIDTH - 20
					Height: 20
					Font: Bold
				Label@PROFILE:
					X: 10
					Y: 29
					Width: 450
					Height: 18
					Font: TinyBold
				Label@PRESENTATION:
					X: 10
					Y: 49
					Width: 450
					Height: 18
					Font: Tiny
				Label@FINGERPRINT:
					X: 470
					Y: 29
					Width: PARENT_WIDTH - 480
					Height: 18
					Align: Right
					Font: TinyBold
				Label@RESTART:
					X: 470
					Y: 49
					Width: PARENT_WIDTH - 480
					Height: 18
					Text: label-experience-review-restart
					Align: Right
					Font: Tiny
		RTSAIPanel@CHANGES_HEADER:
			X: 25
			Y: 160
			Width: 450
			Height: 13
			Background: desktop-panel
			ClickThrough: true
			Children:
				Label@LABEL:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Text: label-experience-review-changes
					Align: Center
					Font: TinyBold
		ScrollPanel@CHANGES:
			BackgroundColor: 101B22
			Background: desktop-scroll
			ScrollBarBackground: desktop-scroll
			Button: desktop-button
			X: 25
			Y: 183
			Width: 450
			Height: 382
			TopBottomSpacing: 5
			ItemSpacing: 5
			Children:
				RTSAIScrollItem@CHANGE_TEMPLATE:
					Width: PARENT_WIDTH - 27
					Height: 78
					Visible: false
					Children:
						Label@STATE:
							X: 8
							Y: 5
							Width: 80
							Height: 18
							Font: TinyBold
						Label@TITLE:
							X: 88
							Y: 5
							Width: PARENT_WIDTH - 96
							Height: 18
							Font: TinyBold
						Label@DESCRIPTION:
							X: 8
							Y: 26
							Width: PARENT_WIDTH - 16
							Height: 47
							Font: Tiny
							WordWrap: true
		RTSAIPanel@MODULES_HEADER:
			X: 505
			Y: 160
			Width: 450
			Height: 13
			Background: desktop-panel
			ClickThrough: true
			Children:
				Label@LABEL:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Text: label-experience-review-inventory
					Align: Center
					Font: TinyBold
		ScrollPanel@MODULES:
			BackgroundColor: 101B22
			Background: desktop-scroll
			ScrollBarBackground: desktop-scroll
			Button: desktop-button
			X: 505
			Y: 183
			Width: 450
			Height: 382
			TopBottomSpacing: 5
			ItemSpacing: 5
			Children:
				RTSAIScrollItem@MODULE_TEMPLATE:
					Width: PARENT_WIDTH - 27
					Height: 142
					Visible: false
					Children:
						Label@STATE:
							X: 8
							Y: 5
							Width: 55
							Height: 18
							Font: TinyBold
						Label@TITLE:
							X: 63
							Y: 5
							Width: PARENT_WIDTH - 71
							Height: 18
							Font: TinyBold
						Label@DESCRIPTION:
							X: 8
							Y: 26
							Width: PARENT_WIDTH - 16
							Height: 111
							Font: Tiny
							WordWrap: true
		RTSAIPanel@EXTERNAL_DISCLOSURE:
			X: 25
			Y: 568
			Width: PARENT_WIDTH - 50
			Height: 75
			Background: dialog3
			Children:
				Label@TITLE:
					X: 10
					Y: 6
					Width: PARENT_WIDTH - 20
					Height: 18
					Text: label-experience-review-external-title
					Font: TinyBold
				Label@DESCRIPTION:
					X: 10
					Y: 40
					Width: PARENT_WIDTH - 20
					Height: 31
					Text: label-experience-review-external-description
					Font: Tiny
					WordWrap: true
				Label@EXTERNAL_STATUS:
					X: 10
					Y: 23
					Width: PARENT_WIDTH - 20
					Height: 16
					Font: TinyBold
		RTSAIButton@BACK_BUTTON:
			Key: escape
			X: PARENT_WIDTH - 370
			Y: PARENT_HEIGHT - 38
			Width: 160
			Height: 28
			Text: button-experience-review-back
			Font: Bold
		RTSAIButton@CONFIRM_BUTTON:
			X: PARENT_WIDTH - 195
			Y: PARENT_HEIGHT - 38
			Width: 170
			Height: 28
			Text: button-experience-review-confirm
			Font: Bold
