# Salvo and swarm (docs/hezbollah-doctrine.md): fewer riflemen, FPV teams, the Rail Technical; the doctrine
# itself (role shares, opening, squad size) is BotDoctrine@hezbollah in doctrines.yaml.
Player:
	DoctrineUnitBuilderBotModule@normal:
		# Only Hezbollah has a drone-swarm unit (the FPV Team), so this share is inert for every other faction.
		RoleShares:
			drone-swarm: 8
		UnitsToBuild:
			r2hzrifle: 60
			r2hzat: 30
			r2hzspotter: 7
			r2hzscout: 2
			r2hzfpv: 14
			r2hzdrone: 8
			r2hzmissileboat: 24
			r2hzskiff: 10
			r2hzsurvey: 6
		# Bots field the r2hzscout commando only after 20 minutes (balance-harness: it traded 0.5 per credit).
		UnitDelays:
			r2hzscout: 30000
		UnitLimits:
			r2hzspotter: 3
			r2hzscout: 1
			r2hzrockets: 5
			r2hzrail: 6
			r2hzfpv: 6
			r2hzdrone: 4
			r2hzskiff: 3
			r2hzsurvey: 2
	DoctrineBaseBuilderBotModule@normal:
