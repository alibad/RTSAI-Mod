World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, experience-objectives.lua, convoy-shield.lua
	MissionData:
		Briefing: briefing
		WinVideo: allymorf.vqa
		LossVideo: shipsink.vqa
	MapOptions:
		TechLevel: high
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	ScriptLobbyDropdown@convoy-validation:
		ID: convoy-validation
		Label: convoy-shield-validation-label
		Description: convoy-shield-validation-description
		Values:
			off: convoy-shield-validation-off
			autoplay: convoy-shield-validation-autoplay
			autoplay-safe: convoy-shield-validation-autoplay-safe
			cargo-failure: convoy-shield-validation-cargo-failure
			tanker-failure: convoy-shield-validation-tanker-failure
			escort-failure: convoy-shield-validation-escort-failure
			survivor-failure: convoy-shield-validation-survivor-failure
		Default: off
		Visible: False

Player:
	PlayerResources:
		DefaultCash: 0

CONVOYSHIELD.CARGO:
	Inherits: LST
	-Buildable:
	RenderSprites:
		Image: lst
	Tooltip:
		Name: actor-convoy-shield-cargo-name
	Health:
		HP: 60000
	Mobile:
		Locomotor: naval
		Speed: 56
	RejectsOrders:
	-Voiced:
	-MustBeDestroyed:
	ActorLostNotification:
		-Notification:
		-TextNotification:

