# Art preview overlay (vehicle animation pass, tools/anim_fx.py). Effect-only death explosions sized by class:
# no damage warheads, so they change nothing in the simulation. Stock explosion sprites referenced by name.
R2FXDeathSmall:
	Inherits: UnitExplodeSmall

R2FXDeathMedium:
	Inherits: UnitExplode

R2FXDeathLarge:
	Inherits: UnitExplode
	Warhead@2Eff: CreateEffect
		Explosions: large_bang, large_brnl, verylarge_clsn, large_tumu
		ImpactSounds: expnew13.wav
		ValidTargets: Ground, Water, Air
		Delay: 5
	Warhead@3Eff: CreateEffect
		Explosions: medium_brnl
		ValidTargets: Ground, Water, Air
		Delay: 11

R2FXShipDeathSmall:
	Inherits: R2FXDeathSmall
	Warhead@9Splash: CreateEffect
		Explosions: small_watersplash
		ValidTargets: Water
		Delay: 3

R2FXShipDeathMedium:
	Inherits: R2FXDeathMedium
	Warhead@9Splash: CreateEffect
		Explosions: large_watersplash
		ValidTargets: Water
		Delay: 4

R2FXShipDeathLarge:
	Inherits: R2FXDeathLarge
	Warhead@9Splash: CreateEffect
		Explosions: huge_watersplash
		ValidTargets: Water
		Delay: 8
