	Valued:
		Cost: 1000
	Health:
		HP: 300
	Armor:
		Type: Light
	Mobile:
		Speed: 120
		TurnSpeed: 28
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 48
	Armament:
		Weapon: R2HZHodeidahMissile
	# Mokha surveillance links coordinate the missile craft's fire.
	ExternalCondition@targeting:
		Condition: r2-hz-targeting
