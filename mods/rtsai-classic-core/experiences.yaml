		saudi-arabia-faction:
			Title: Saudi Arabia
			Description: Expeditionary combined arms built around high-quality armor, air power, layered defense, and modern Red Sea naval support.
			Effects: Adds Saudi Arabia to the Allies lobby and random pool with a complete country roster, doctrine metadata, AI roles, and presentation preview.
			Tradeoffs: Expensive advanced platforms reward coordination but make attrition and poor positioning costly.
