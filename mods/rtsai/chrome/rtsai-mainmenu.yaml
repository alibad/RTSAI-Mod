# The RTS AI main menu (replaces common|chrome/mainmenu.yaml). Same widget ids and logic as the stock menu; the look
# is ours: a full-window render of one flagship per faction (tools/standalone-menu.py), the product name, a single
# column of buttons on a dark glass band, the build version, and a one-line forum-profile link at the top right.
# No news box and no content-manager button: the standalone game has no external content to manage.

Container@MAINMENU:
	Logic: RTSAIFrontlineMainMenuLogic, RTSAIGameModesLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		CoverImage@BACKDROP:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			ImageCollection: frontline
			ImageName: backdrop
			FocusX: 0.62
		FrontlineCanvas@FRONTLINE_BRAND:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			Children:
				FrontlineImage@FRONTLINE_LOGO:
					X: 92
					Y: 94
					Width: 450
					Height: 149
					ImageCollection: frontline-assets
					ImageName: logo
		Container@MENUS:
			X: WINDOW_WIDTH * 66 / 1000
			Y: WINDOW_HEIGHT * 39 / 100
			Width: 310
			Height: 340
			Children:
				Container@MAIN_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						FrontlineButton@EARTH_STUDIO_BUTTON:
							Visible: false
							Width: 1
							Height: 1
						FrontlineButton@SINGLEPLAYER_BUTTON:
							Y: 40
							Width: PARENT_WIDTH
							Height: 38
							Text: label-singleplayer-title
							DesignFontSize: 24
						FrontlineButton@MULTIPLAYER_BUTTON:
							Y: 88
							Width: PARENT_WIDTH
							Height: 38
							Text: label-multiplayer-title
							DesignFontSize: 24
						FrontlineButton@SETTINGS_BUTTON:
							Y: 136
							Width: PARENT_WIDTH
							Height: 38
							Text: button-settings-title
							DesignFontSize: 24
						FrontlineButton@EXTRAS_BUTTON:
							Y: 184
							Width: PARENT_WIDTH
							Height: 38
							Text: button-extras-title
							DesignFontSize: 24
						FrontlineButton@GAME_MODES_BUTTON:
							Y: 232
							Width: PARENT_WIDTH
							Height: 38
							Text: rtsai-game-modes
							DesignFontSize: 24
						FrontlineButton@QUIT_BUTTON:
							Y: 280
							Width: PARENT_WIDTH
							Height: 38
							Text: button-quit
							DesignFontSize: 24
				Container@SINGLEPLAYER_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@SINGLEPLAYER_MENU_TITLE:
							Width: PARENT_WIDTH
							Height: 30
							Text: label-singleplayer-title
							Font: Bold
							TextColor: E9DECB
							Shadow: true
						FrontlineButton@SKIRMISH_BUTTON:
							Y: 40
							Width: PARENT_WIDTH
							Height: 38
							Text: button-singleplayer-menu-skirmish
							DesignFontSize: 24
						FrontlineButton@MISSIONS_BUTTON:
							Y: 88
							Width: PARENT_WIDTH
							Height: 38
							Text: label-missions-title
							DesignFontSize: 24
						FrontlineButton@LOAD_BUTTON:
							Y: 136
							Width: PARENT_WIDTH
							Height: 38
							Text: button-singleplayer-menu-load
							DesignFontSize: 24
						FrontlineButton@BACK_BUTTON:
							Key: escape
							Y: 280
							Width: PARENT_WIDTH
							Height: 38
							Text: button-back
							DesignFontSize: 24
				Container@EXTRAS_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@EXTRAS_MENU_TITLE:
							Width: PARENT_WIDTH
							Height: 30
							Text: button-extras-title
							Font: Bold
							TextColor: E9DECB
							Shadow: true
						FrontlineButton@REPLAYS_BUTTON:
							Y: 32
							Width: PARENT_WIDTH
							Height: 38
							Text: button-extras-menu-replays
							DesignFontSize: 24
						FrontlineButton@MUSIC_BUTTON:
							Y: 70
							Width: PARENT_WIDTH
							Height: 38
							Text: label-music-title
							DesignFontSize: 24
						FrontlineButton@MAP_EDITOR_BUTTON:
							Y: 108
							Width: PARENT_WIDTH
							Height: 38
							Text: label-map-editor-title
							DesignFontSize: 24
						FrontlineButton@ASSETBROWSER_BUTTON:
							Y: 146
							Width: PARENT_WIDTH
							Height: 38
							Text: button-extras-menu-assetbrowser
							DesignFontSize: 24
						FrontlineButton@CREDITS_BUTTON:
							Y: 184
							Width: PARENT_WIDTH
							Height: 38
							Text: label-credits-title
							DesignFontSize: 24
						FrontlineButton@SAVED_GAMES_TOOLS:
							Y: 222
							Width: PARENT_WIDTH
							Height: 38
							Text: frontline-load-game
							DesignFontSize: 24
						FrontlineButton@STUDIO_TOOLS:
							Y: 260
							Width: PARENT_WIDTH
							Height: 38
							Text: frontline-studio
							DesignFontSize: 24
						FrontlineButton@BACK_BUTTON:
							Key: escape
							Y: 298
							Width: PARENT_WIDTH
							Height: 38
							Text: button-back
							DesignFontSize: 24
				Container@MAP_EDITOR_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@MAP_EDITOR_MENU_TITLE:
							Width: PARENT_WIDTH
							Height: 30
							Text: label-map-editor-title
							Font: Bold
							TextColor: E9DECB
							Shadow: true
						FrontlineButton@NEW_MAP_BUTTON:
							Y: 40
							Width: PARENT_WIDTH
							Height: 38
							Text: button-map-editor-new-map
							DesignFontSize: 24
						FrontlineButton@LOAD_MAP_BUTTON:
							Y: 88
							Width: PARENT_WIDTH
							Height: 38
							Text: button-map-editor-load-map
							DesignFontSize: 24
						FrontlineButton@BACK_BUTTON:
							Key: escape
							Y: 280
							Width: PARENT_WIDTH
							Height: 38
							Text: button-back
							DesignFontSize: 24
		Label@VERSION_LABEL:
			Visible: false
			Logic: RTSAIVersionLabelLogic
			X: WINDOW_WIDTH - 424
			Y: WINDOW_HEIGHT - 34
			Width: 400
			Height: 20
			Align: Right
			Font: Small
			TextColor: AEB6BF
			Shadow: true
		Container@PLAYER_PROFILE_CONTAINER:
			Visible: false
			Logic: RTSAILocalProfileLogic
			X: WINDOW_WIDTH - 384
			Y: 16
		Container@PERFORMANCE_INFO:
			Logic: PerfDebugLogic
			Children:
				Label@PERF_TEXT:
					X: 30
					Y: WINDOW_HEIGHT - 70
					Width: 170
					Height: 40
					Contrast: true
				RTSAIPanel@GRAPH_BG:
					ClickThrough: true
					Background: dialog4
					X: WINDOW_WIDTH - 240
					Y: WINDOW_HEIGHT - 240
					Width: 210
					Height: 210
					Children:
						PerfGraph@GRAPH:
							X: 5
							Y: 5
							Width: 200
							Height: 200

# The forum-profile link as one quiet line (the stock panel is a 270x100 box with three lines of text). Same ids, so
# the stock LocalProfileLogic drives it; RTSAILocalProfileLogic loads it.
Container@RTSAI_LOCAL_PROFILE_PANEL:
	Logic: LocalProfileLogic
	Width: 360
	Height: 24
	Children:
		Container@PROFILE_HEADER:
			Width: PARENT_WIDTH
			Height: 24
			Children:
				Label@PROFILE_NAME:
					Width: 220
					Height: 22
					Align: Right
					Font: Bold
					Shadow: true
				Label@PROFILE_RANK:
					X: 226
					Width: 70
					Height: 22
					Font: TinyBold
					TextColor: AEB6BF
					Shadow: true
				FrontlineButton@DESTROY_KEY:
					X: PARENT_WIDTH - 60
					Width: 60
					Height: 22
					Font: TinyBold
					Text: button-profile-unlink
		Container@BADGES_CONTAINER:
			Y: 28
			Width: PARENT_WIDTH
			Visible: false
		Container@LINK_ACCOUNT:
			Width: PARENT_WIDTH
			Height: 24
			Children:
				FrontlineButton@LINK_BUTTON:
					Width: PARENT_WIDTH
					Height: 22
					Background:
					Align: Right
					Font: TinyBold
					TextColor: 8FA7B0
					Text: button-rtsai-profile-link
		Container@CHECKING_FINGERPRINT:
			Width: PARENT_WIDTH
			Height: 24
			Children:
				Label@CHECKING:
					Width: PARENT_WIDTH
					Height: 22
					Align: Right
					Font: Tiny
					TextColor: 8FA7B0
					Shadow: true
					Text: label-rtsai-profile-checking
		Container@CONNECTION_ERROR:
			Width: PARENT_WIDTH
			Height: 24
			Children:
				Label@ERROR:
					Width: PARENT_WIDTH - 66
					Height: 22
					Align: Right
					Font: Tiny
					TextColor: 8FA7B0
					Shadow: true
					Text: label-rtsai-profile-error
				FrontlineButton@RETRY_BUTTON:
					X: PARENT_WIDTH - 60
					Width: 60
					Height: 22
					Font: TinyBold
					Text: button-retry
