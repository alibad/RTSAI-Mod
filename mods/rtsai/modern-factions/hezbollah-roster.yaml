# Hezbollah, "Salvo and swarm" (docs/hezbollah-doctrine.md): few but veteran fighters, cheap unguided rocket
# volume and FPV micro-drone teams. Spotters and signal posts guide missiles and extend the drone link; coastal
# forces need surveillance links; defenses hide until they fire. Detection, splash and anti-air answer them.
^R2HezbollahInfantry:
	Inherits: ^Infantry
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@MC: ^MindControllable
	Buildable:
		Queue: Infantry
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Selectable:
		Bounds: 600, 1500, 0, -530
	FirepowerMultiplier@ELITEARMS:
		RequiresCondition: rank-elite
		Modifier: 140
	-WithDeathAnimation@effect:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 32
	Armament:
		Weapon: R2HZMountainRifle
	ProducibleWithLevel:
		Prerequisites: barracks.infiltrated
	# Doctrine: every fighter leaves the barracks Veteran.
	ProducibleWithLevel@doctrine:
		InitialLevels: 1
	# Hill fighters: rough ground is cover (80 -> 90 in balance trim 1, docs/balance.md round 5).
	GrantConditionOnTerrain@rough:
		Condition: hz-rough
		TerrainTypes: Rough
	DamageMultiplier@rough:
		Modifier: 90
		RequiresCondition: hz-rough
	# Stationary concealment: moving, firing or taking damage reveals the fighter.
	Cloak:
		InitialDelay: 85
		CloakDelay: 95
		UncloakOn: Attack, Move, Damage
		DetectionTypes: Cloak
		IsPlayerPalette: true
	RevealsShroud:
		Range: 5c0

r2hzrifle:
	Inherits: ^R2HezbollahInfantry
	Tooltip:
		Name: levant-r2hzrifle-name
	Buildable:
		Prerequisites: ~faction.hezbollah, nahand
		BuildPaletteOrder: 10
		Description: levant-r2hzrifle-description
	# Salvo and swarm: 150 -> 275 and 100 -> 130 HP, rifle 13 -> 14 (16 in the design), Veteran from the barracks:
	# fewer, stronger fighters. The design (225, 16) measured 2.07 destroyed per credit (round 5); trims 2-3.
	Valued:
		Cost: 275
	Health:
		HP: 130
	Mobile:
		Speed: 66
	# Promotion at 60% of the usual kills (the thresholds are a share of this value, not of the cost).
	GainsExperience:
		ExperienceModifier: 165

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
r2hzat:
	Inherits: ^R2HezbollahInfantry
	Inherits@guidance: ^R2HezbollahGuided
	Tooltip:
		Name: levant-r2hzat-name
	WithColoredOverlay@guidance:
		Color: 52E7D628
		RequiresCondition: r2-hz-guidance
	Buildable:
		Prerequisites: ~faction.hezbollah, nahand
		BuildPaletteOrder: 20
		Description: levant-r2hzat-description
	# 300 -> 350 (round 4); Salvo and swarm: 550, 95 -> 120 HP, RPG 80 -> 90 at 5 cells, stationary concealment
	# (template) and Veteran from the barracks: an ambush team bought in fewer numbers. Round 5: 450 traded 1.31
	# destroyed per credit; without concealment (trims 1-2) Hezbollah fell to 21% against America, whose bots field
	# almost no detectors, while the modern factions all do; so the concealment stays and the price carries the trim.
	Valued:
		Cost: 550
	Health:
		HP: 120
	Mobile:
		Speed: 60
	Armament:
		Weapon: R2HZYemenRPG
	RevealsShroud:
		Range: 6c0
	GainsExperience:
		ExperienceModifier: 330

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
r2hzspotter:
	Inherits: ^R2HezbollahInfantry
	Tooltip:
		Name: levant-r2hzspotter-name
	Buildable:
		Prerequisites: ~faction.hezbollah, nahand, radar
		BuildPaletteOrder: 60
		Description: levant-r2hzspotter-description
	# Salvo and swarm: 525 -> 450, 90 -> 115 HP; also relays the FPV drone link.
	Valued:
		Cost: 450
	Health:
		HP: 115
	Mobile:
		Speed: 64
	Armament:
		Weapon: R2HZSpotterCarbine
	RevealsShroud:
		Range: 10c0
	DetectCloaked:
		DetectionTypes: Cloak
		Range: 7c0
	RenderDetectionCircle:
	ProximityExternalCondition@guidance:
		Condition: r2-hz-guidance
		Range: 6c0
		ValidRelationships: Ally
	ProximityExternalCondition@fpvlink:
		Condition: r2-hz-fpvlink
		Range: 6c0
		ValidRelationships: Ally
	GainsExperience:
		ExperienceModifier: 270
	WithRangeCircle@guidance:
		Range: 6c0
		Color: 52E7D680

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
r2hzscout:
	Inherits: ^R2HezbollahInfantry
	Tooltip:
		Name: levant-r2hzscout-name
	Buildable:
		Prerequisites: ~faction.hezbollah, nahand, natech
		BuildPaletteOrder: 140
		BuildLimit: 1
		Description: levant-r2hzscout-description
	# The faction's hero (every faction has one build-limit-1 commando): 1650 -> 1800, 170 -> 240 HP, leaves the
	# barracks Elite (template Veteran + this level), carbine 30 -> 34.
	Valued:
		Cost: 1800
	Health:
		HP: 240
	Mobile:
		Speed: 82
	ProducibleWithLevel@hero:
		InitialLevels: 1
	Armament:
		Weapon: R2HZGhostCarbine
	Armament@remote:
		Name: secondary
		Weapon: R2HZRemoteCharge
	AttackFrontal:
		Armaments: primary, secondary
	Demolition:
		DetonationDelay: 80
		Voice: Demolish
	Passenger:
		CustomPipType: red
	# Persistent camouflage: moving does not reveal the Ghost, attacking does.
	Cloak:
		InitialDelay: 40
		CloakDelay: 70
		UncloakOn: Attack, Demolish, Damage
		DetectionTypes: Cloak
		IsPlayerPalette: true
	RevealsShroud:
		Range: 7c0
	VoiceAnnouncement:
		Voice: Build

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair
# FPV Team: an operator with a backpack rack of three FPV micro-drones (the stock carrier mechanism,
# CarrierParent / CarrierChild, as the Aircraft Carrier's Hornets). Each launch reveals the concealed operator;
# a drone is one-way (destroyed by its own charge) and the rack regrows one drone every 6 s. Killing the
# operator downs its airborne drones.
r2hzfpv:
	Inherits: ^R2HezbollahInfantry
	Inherits@guidance: ^R2HezbollahGuided
	Tooltip:
		Name: levant-r2hzfpv-name
	Buildable:
		Prerequisites: ~faction.hezbollah, nahand, radar
		BuildPaletteOrder: 50
		Description: levant-r2hzfpv-description
	Valued:
		Cost: 500
	Health:
		HP: 110
	Mobile:
		Speed: 60
	Armament:
		Weapon: R2HZSpotterCarbine
	Armament@launcher:
		Name: launcher
		Weapon: R2HZFPVLink
	AttackFrontal:
		Armaments: primary, launcher
	CarrierParent:
		Actors: r2hzquad, r2hzquad, r2hzquad
		RespawnTicks: 150
		RearmTicks: 40
		ArmamentNames: launcher
		ChildDisposalOnKill: KillChildren
		ChildDisposalOnOwnerChange: KillChildren
	WithCarrierParentPipsDecoration:
		Position: BottomLeft
		Palette: pips
		RequiresSelection: true
	# The drone link: drones outside every link crash (r2hzquad KillsSelf@nolink).
	ProximityExternalCondition@fpvlink:
		Condition: r2-hz-fpvlink
		Range: 8c0
		ValidRelationships: Ally
	WithRangeCircle@fpvlink:
		Range: 8c0
		Color: E0504080
	RevealsShroud:
		Range: 7c0
	GainsExperience:
		ExperienceModifier: 300

	ExternalCondition@repair:
		Condition: hezbollah-repair
	ChangesHealth@field:
		Step: 2
		Delay: 25
		StartIfBelow: 70
		RequiresCondition: hezbollah-repair

# FPV micro-drone, carried and launched by r2hzfpv; never built on its own. Small, fast and fragile: anti-air
# and small arms (^MG weapons, MicroDrone target type) shoot it down; cannons, artillery and missiles cannot.
r2hzquad:
	Inherits: ^R2ModernDrone
	-Buildable:
	-Selectable:
	-Repairable:
	-ActorLostNotification:
	-Voiced:
	Interactable:
		Bounds: 512, 512
	RejectsOrders:
	Tooltip:
		Name: levant-r2hzquad-name
	Valued:
		Cost: 30
	Health:
		HP: 25
	Armor:
		Type: Light
	Aircraft:
		Speed: 250
		CruiseAltitude: 640
		TurnSpeed: 80
		AltitudeVelocity: 160
		IdleBehavior: None
		Repulsable: false
	AttackAircraft:
		FacingTolerance: 512
	RevealsShroud:
		Range: 4c0
	Armament:
		Weapon: R2HZFPVCharge
	CarrierChild:
		LandingDistance: 1c0
		DamageTypes: ExplosionDeath
	Targetable@microdrone:
		TargetTypes: MicroDrone
		RequiresCondition: airborne
	# One-way: the drone is destroyed by its own charge (killed, not removed, so the operator's rack regrows it).
	GrantConditionOnAttack@expended:
		Condition: expended
	KillsSelf@expended:
		RequiresCondition: expended
		DamageTypes: ExplosionDeath
	# Out of every FPV link (operator 8 cells, spotter 6, powered signal post 6) for 1.6 s: the drone crashes.
	ExternalCondition@link:
		Condition: r2-hz-fpvlink
	KillsSelf@nolink:
		RequiresCondition: !r2-hz-fpvlink
		Delay: 40
		DamageTypes: ExplosionDeath
	FireWarheadsOnDeath:
		Weapon: R2HZFPVBurst
		EmptyWeapon: R2HZFPVBurst

# One-way loitering munition: removed on its terminal attack, no rearming.
r2hzdrone:
	Inherits: ^R2ModernDrone
	Tooltip:
		Name: levant-r2hzdrone-name
	Buildable:
		Prerequisites: ~faction.hezbollah, naweap, radar
		BuildPaletteOrder: 85
		Description: levant-r2hzdrone-description
	# Salvo and swarm: scaled down, 700 -> 450, 90 -> 60 HP, faster (150 -> 190), warhead 220 -> 150.
	Valued:
		Cost: 450
	Health:
		HP: 60
	Aircraft:
		Speed: 190
		CruiseAltitude: 1536
	Armament:
		Weapon: R2HZSamadWarhead
	AmbientSound@loiter:
		SoundFiles: ra2|modern-factions/audio/redsea-drone-loiter.wav
		RequiresCondition: cruising
	RevealsShroud:
		Range: 8c0
	GrantConditionOnAttack:
		Condition: expended
	KillsSelf:
		RequiresCondition: expended
		RemoveInstead: true
	SpawnActorOnDeath:
		Actor: r2hzdronehusk

r2hzdronehusk:
	Inherits: ^R2DroneHusk

