	ProvidesPrerequisite@israel:
		Prerequisite: faction.israel
		Factions: israel
	DoctrineUnitBuilderBotModule@normal:
		UnitsToBuild:
			r2merkava: 60
			r2ilshield: 20
			r2ilhowitzer: 20
			r2namer: 12
		UnitLimits:
			r2namer: 3
	DoctrineUnitBuilderBotModule@medium:
		UnitsToBuild:
			r2merkava: 60
			r2ilshield: 20
			r2ilhowitzer: 20
			r2namer: 12
		UnitLimits:
			r2namer: 3
	DoctrineUnitBuilderBotModule@rush:
		UnitsToBuild:
			r2merkava: 60
			r2ilshield: 20
			r2ilhowitzer: 20
			r2namer: 12
		UnitLimits:
