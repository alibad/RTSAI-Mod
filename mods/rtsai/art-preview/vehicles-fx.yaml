# Art preview overlay: vehicle animation pass (tools/anim_fx.py; local branch rtsai/art-preview only).
# Loaded after vehicles.yaml. One "# glb-fx:<actor>" block per unit; regenerate, never hand-edit.


# glb-fx:r2mantis begin
r2mantis:
	GrantConditionOnDamageState@R2FXHEAVY:
		Condition: r2fx-heavy
		ValidDamageStates: Heavy, Critical
	GrantConditionOnDamageState@R2FXCRIT:
		Condition: r2fx-critical
		ValidDamageStates: Critical
	WithIdleOverlay@R2FXSMOKE:
		Image: r2fxsmoke
		Sequence: idle
		Palette: effect
		Offset: -165,0,377
		RequiresCondition: r2fx-heavy
	WithIdleOverlay@R2FXFIRE:
		Image: r2fxfire-medium
		Sequence: idle
		Palette: effect
		Offset: -165,0,230
		RequiresCondition: r2fx-critical
	FireWarheadsOnDeath:
		Weapon: R2FXDeathMedium
		EmptyWeapon: R2FXDeathMedium
	Armament:
		MuzzleSequence: muzzle-launch
# glb-fx:r2mantis end

