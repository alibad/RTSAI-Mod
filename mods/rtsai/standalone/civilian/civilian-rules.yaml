# Standalone civilians: the civ* actors wear the project's civilian looks (tools/civilian_models.py), each drawn
# with its own fixed palette (no player colour), they panic with their own panic-run / panic-stand sequences
# and, idle, they wander a few steps now and then (village life).
# Generated by RTSAI-Art tools/civilians.py install; reinstall, never hand-edit.

^Palettes:
	PaletteFromFile@civ-thobe:
		Name: civ-thobe
		Filename: ra2|standalone/civilian/civ-thobe.pal
		ShadowIndex: 1
	PaletteFromFile@civ-abaya:
		Name: civ-abaya
		Filename: ra2|standalone/civilian/civ-abaya.pal
		ShadowIndex: 1
	PaletteFromFile@civ-scarf:
		Name: civ-scarf
		Filename: ra2|standalone/civilian/civ-scarf.pal
		ShadowIndex: 1
	PaletteFromFile@civ-fisher:
		Name: civ-fisher
		Filename: ra2|standalone/civilian/civ-fisher.pal
		ShadowIndex: 1
	PaletteFromFile@civ-elder:
		Name: civ-elder
		Filename: ra2|standalone/civilian/civ-elder.pal
		ShadowIndex: 1
	PaletteFromFile@civ-youth:
		Name: civ-youth
		Filename: ra2|standalone/civilian/civ-youth.pal
		ShadowIndex: 1

civ1:
	RenderSprites:
		Image: civ-abaya
		Palette: civ-abaya
	Tooltip:
		Name: standalone-civilian-abaya-name
	ScaredyCat:
		PanicSequencePrefix: panic-
	Wanders:
		WanderMoveRadius: 2
		MinMoveDelay: 250
		MaxMoveDelay: 750

