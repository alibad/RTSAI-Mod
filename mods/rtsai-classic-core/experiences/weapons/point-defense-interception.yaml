# Validation fixtures and safe defaults for reusable projectile interception.
ReusablePointDefenseTracer:
	ReloadDelay: 8
	Range: 6c0
	ValidTargets: Ground, Water, Air, GroundActor, WaterActor, AirborneActor
	Projectile: InstantHit
	Warhead@InterceptEffect: CreateEffect
		Explosions: small_explosion_air
		ValidTargets: Ground, Water, Air, GroundActor, WaterActor, AirborneActor

ReusableInterceptableMissile:
	ReloadDelay: 50
	Range: 8c0
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Projectile: Missile
		Speed: 320
		RangeLimit: 10c0
		PointDefenseType: Missile
		DetonateOnInterception: false
	Warhead@Damage: SpreadDamage
		Spread: 128
		Damage: 1000
		ValidTargets: Ground, Water, GroundActor, WaterActor
