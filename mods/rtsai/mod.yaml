SoundFormats: Aud, Wav

SpriteFormats: ShpTS, TmpTS, ShpTD, PngSheet

VideoFormats: Vqa

TerrainFormat: DefaultTerrain

SpriteSequenceFormat: TilesetSpecificSpriteSequence
	TilesetExtensions:
		TEMPERATE: .tem
		SNOW: .sno
		URBAN: .urb
	TilesetCodes:
		GENERIC: g
		SNOW: a
		TEMPERATE: t
		URBAN: u
	TilesetSuffixes:
		SNOW: a


AssetBrowser:
	SpriteExtensions: .shp, .tem, .urb, .sno
	ModelExtensions: .vxl
	AudioExtensions: .aud, .wav
	VideoExtensions: .vqa

GameSpeeds:
	DefaultSpeed: default
	Speeds:
		slowest:
			Name: options-game-speed.slowest
			Timestep: 80
			OrderLatency: 2
		slower:
			Name: options-game-speed.slower
			Timestep: 50
			OrderLatency: 3
		default:
			Name: options-game-speed.normal
			Timestep: 40
			OrderLatency: 3
		fast:
			Name: options-game-speed.fast
			Timestep: 35
			OrderLatency: 4
		faster:
			Name: options-game-speed.faster
			Timestep: 30
			OrderLatency: 4
		fastest:
			Name: options-game-speed.fastest
			Timestep: 20
			OrderLatency: 6
