		ra2mix|generic.mix
		ra2mix|isogen.mix
		ra2mix|isosnow.mix
		ra2mix|isotemp.mix
		ra2mix|isourb.mix
		ra2mix|load.mix
		ra2mix|local.mix: local
		ra2mix|neutral.mix
		ra2mix|sidec01.mix
		ra2mix|sidec02.mix
		ra2mix|sno.mix
		ra2mix|snow.mix
		ra2mix|tem.mix
		ra2mix|temperat.mix
		ra2mix|urb.mix
		ra2mix|urban.mix
		# Mod-provided packages load after content so they can override it.
		ra2|bits
		ra2|bits/cameos
		ra2|bits/structures
		ra2|bits/animations
		ra2|bits/projectiles
	ContentInstallerMod: rtsai-content

