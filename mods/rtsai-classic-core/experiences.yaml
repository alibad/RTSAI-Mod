ExperienceCatalog:
	Mod: rtsai-classic-core
	DefaultProfile: world-war-iii
	Components:
		faction-and-subfaction-contract:
			Kind: Authoring
			Title: Faction and doctrine contract
			Description: Stable country, side, doctrine, and unit-role identifiers for rosters, AI, missions, promotions, and captured technology.
			Effects: Publishes faction, doctrine, combat-role, counter, AI-weight, and transport metadata used by the modern country rosters and dependent modules.
			Tradeoffs: No direct combat or economy change by itself; enabling it can automatically support modules that depend on this shared vocabulary.
			Scope: Framework metadata for actors and players that inherit its contracts; it does not add units or change a faction roster on its own.
			Category: Factions and strategies
			Preview: ra|uibits/experience-previews/faction-and-subfaction-contract.png
			Version: 1
			Source: RA Plus, Combined Arms, Cameo, and Generals Alpha patterns synthesized for OpenRA AI
			License: GPL-3.0-or-later code; no upstream presentation assets
			Rules: ra|experiences/components/faction-doctrine-contract.yaml
		red-sea-roster-content:
			Title: Red Sea roster foundation
			Description: Shared Saudi Arabian and Yemeni roster data used by their independently selectable faction packs.
			Effects: Loads the common Red Sea actor, weapon, sequence, and naval definitions required by either country roster.
			Tradeoffs: Internal dependency only; it is enabled and removed automatically with the faction packs that require it.
			Scope: Shared faction-pack implementation data.
			Category: Faction packs
			Version: 1
			Source: Original OpenRA AI faction work
			License: GPL-3.0-or-later code; original project presentation
			Kind: Internal
			Hidden: true
			Rules: ra|rules/red-sea.yaml, ra|rules/naval-systems.yaml
			Weapons: ra|weapons/red-sea.yaml, ra|weapons/naval-systems.yaml
			Sequences: ra|sequences/red-sea.yaml, ra|sequences/naval-systems.yaml
		israel-faction:
			Title: Israel
			Description: Fictional RTS faction; precision armor and protected support.
			Effects: Complete faction roster, production trees, support buildings and bot composition.
			Tradeoffs: High costs and dependency on vulnerable support.
			Scope: Selectable faction; local development content.
			Category: Faction packs
			Version: 1
			Source: Original project rules and procedural art
			License: GPL-3.0-or-later code; original project presentation
			Kind: Faction
			Dependencies: faction-and-subfaction-contract, red-sea-roster-content, naval-combat-archetypes
			Rules: ra|rules/levant-common.yaml, ra|rules/israel.yaml
			Sequences: ra|sequences/israel.yaml
			Faction:
				InternalName: israel
				Side: Allies
				RandomPool: RandomAllies
				Doctrine: precision-support
				Preview: ra|uibits/faction-previews/israel.png
				Roster:
