		CloakDelay: 125
		UncloakOn: Attack, Damage
		DetectionTypes: Cloak
		IsPlayerPalette: true
		# Unpowered concealment fails too, so a beaten Hezbollah base can always be found and destroyed.
		RequiresCondition: !build-incomplete && !lowpower

