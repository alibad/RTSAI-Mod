		^EngineDir
		$rtsai: ra2
		^EngineDir|mods/common: common
		~^SupportDir|Content/ra2: content
		ra2|uibits
	ContentPackages:
		# Red Alert 2 (original game files installed by rtsai-content)
		content|language.mix: lang
