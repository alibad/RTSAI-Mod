# The original Red Alert 2 factions, only in the classic add-on (it needs the player's own RA2 files).
# The standalone game's ^BaseWorld offers the 7 modern factions; this file adds the originals back.

^BaseWorld:
	Faction@random:
		RandomFactionMembers: random-allies, random-soviets
	Faction@allies:
		Name: faction-random-allies-name
		InternalName: random-allies
		RandomFactionMembers: america, germany, england, france, korea, china, turkey, saudi, israel
		Side: Randoms
		Description: faction-random-allies-description
	Faction@soviets:
		Name: faction-random-soviets-name
		InternalName: random-soviets
		RandomFactionMembers: cuba, libya, iraq, russia, iran, yemen, hezbollah
		Side: Randoms
		Description: faction-random-soviets-description
	Faction@1:
		Name: faction-america-name
		InternalName: america
		Side: Allies
		Description: faction-america-description
	Faction@2:
		Name: faction-germany-name
		InternalName: germany
		Side: Allies
		Description: faction-germany-description
	Faction@3:
		Name: faction-england-name
		InternalName: england
		Side: Allies
		Description: faction-england-description
	Faction@4:
		Name: faction-france-name
		InternalName: france
		Side: Allies
		Description: faction-france-description
	Faction@5:
		Name: faction-korea-name
		InternalName: korea
		Side: Allies
		Description: faction-korea-description
	Faction@6:
		Name: faction-cuba-name
		InternalName: cuba
		Side: Soviets
		Description: faction-cuba-description
	Faction@7:
		Name: faction-libya-name
		InternalName: libya
		Side: Soviets
		Description: faction-libya-description
	Faction@8:
		Name: faction-iraq-name
		InternalName: iraq
		Side: Soviets
		Description: faction-iraq-description
	Faction@9:
		Name: faction-russia-name
		InternalName: russia
		Side: Soviets
		Description: faction-russia-description

