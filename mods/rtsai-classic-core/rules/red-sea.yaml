# JTAC designations are a first-class target state.  Only Red Sea guided
# weapons include bonus warheads against the tag, so normal small arms do not
# receive a hidden global damage buff.
^Infantry:
	ExternalCondition@REDSEA_DESIGNATED:
		Condition: redsea-designated
	Targetable@REDSEA_DESIGNATED:
		TargetTypes: RedSeaDesignated
		RequiresCondition: redsea-designated
	WithColoredOverlay@REDSEA_DESIGNATED:
		Color: 35D8C360
		RequiresCondition: redsea-designated

^Vehicle:
	ExternalCondition@REDSEA_DESIGNATED:
		Condition: redsea-designated
	Targetable@REDSEA_DESIGNATED:
		TargetTypes: RedSeaDesignated
		RequiresCondition: redsea-designated
	WithColoredOverlay@REDSEA_DESIGNATED:
		Color: 35D8C360
		RequiresCondition: redsea-designated

^Ship:
	ExternalCondition@REDSEA_DESIGNATED:
		Condition: redsea-designated
