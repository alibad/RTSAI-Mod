# Economy compensation (coordinator, 7 October 2026): the refinery upgrade that replaces the ore purifier.
# The heavy power plant is nanrct above; the refinery's socket is in garefn above.
gapurifier:
	Interactable:
	Building:
	FootprintPlaceBuildingPreview:
	KillsSelf:
		RemoveInstead: true
	RenderSprites:
		Image: purifier-china
		FactionImages:
			china: purifier-china
			iran: purifier-iran
			turkey: purifier-turkey
			saudi: purifier-saudi
			israel: purifier-israel
			yemen: purifier-yemen
			hezbollah: purifier-hezbollah
	Valued:
		Cost: 1000
	Tooltip:
		Name: standalone-purifier-name
	Buildable:
		Queue: Building
		BuildPaletteOrder: 100
		Prerequisites: garefn, gatech, ~structures.allies
		Description: standalone-purifier-description
	Plug:
		Type: purifier

Player:
	DoctrineBaseBuilderBotModule@normal:
		BuildingFractions:
			gapurifier: 4
	DoctrineBaseBuilderBotModule@medium:
		BuildingFractions:
			gapurifier: 4
	DoctrineBaseBuilderBotModule@rush:
		BuildingFractions:
			gapurifier: 4
	DoctrineBaseBuilderBotModule@turtle:
		BuildingFractions:
			gapurifier: 4
	DoctrineBaseBuilderBotModule@naval:
